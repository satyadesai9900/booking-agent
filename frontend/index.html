    // Helper: Formatted text rendering with clickable links & badge buttons
    function parseFormattedText(text) {
      if (!text) return null;
      const tokenRegex = /(\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\))|(https?:\/\/[^\s\)]+)|(\*\*([^*]+)\*\*)/g;
      const elements = [];
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          elements.push(text.slice(lastIndex, match.index));
        }

        if (match[1]) {
          const linkText = match[2];
          const url = match[3];
          elements.push(
            <a
              key={match.index}
              href={url}
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center space-x-1 px-2 py-0.5 mx-0.5 rounded-md bg-indigo-500/20 hover:bg-indigo-500/35 text-indigo-300 hover:text-white border border-indigo-500/40 transition-all font-medium text-xs group cursor-pointer"
            >
              <span>{linkText}</span>
              <Icons.ExternalLink />
            </a>
          );
        } else if (match[4]) {
          const url = match[4];
          elements.push(
            <a
              key={match.index}
              href={url}
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center space-x-1 text-indigo-400 hover:text-indigo-300 underline font-medium break-all"
            >
              <span>{url}</span>
              <Icons.ExternalLink />
            </a>
          );
        } else if (match[5]) {
          elements.push(
            <strong key={match.index} className="font-semibold text-white">
              {match[6]}
            </strong>
          );
        }

        lastIndex = tokenRegex.lastIndex;
      }

      if (lastIndex < text.length) {
        elements.push(text.slice(lastIndex));
      }

      return elements.length > 0 ? elements : text;
    }

    // Component: Boarding Pass / Ticket Confirmation Card

      const [copied, setCopied] = useState(false);
      
      const idMatch = text.match(/(?:Official Carrier PNR|Booking ID|Reference|PNR):\s*([A-Za-z0-9\-]+)/i);

      const bookingId = idMatch[1];

      return (

    // Component: Message Bubble in AI Helper
    function MessageBubble({ msg }) {
      const isUser = msg.sender === "user";

      const renderContent = (content) => {
        if (!content) return null;
        return content.split("\n").map((line, idx) => {
          const trimmed = line.trim();
          if (!trimmed) return <div key={idx} className="h-2" />;

          if (trimmed.startsWith("> ")) {
            return (
              <div key={idx} className="my-1.5 p-2 rounded-lg bg-indigo-500/10 border-l-2 border-indigo-400 text-xs text-indigo-200">
                {parseFormattedText(trimmed.slice(2))}
              </div>
            );
          }

          if (trimmed.startsWith("### ")) {
            return (
              <h4 key={idx} className="font-bold text-white text-sm mt-2 mb-1">
                {parseFormattedText(trimmed.slice(4))}
              </h4>
            );
          }

          return (
            <p key={idx} className="leading-relaxed">
              {parseFormattedText(line)}
            </p>
          );
        });
      };

      return (
        <div className={`flex w-full ${isUser ? "justify-end" : "justify-start"} my-3`}>
          <div className={`flex items-start max-w-[88%] space-x-2.5 ${isUser ? "flex-row-reverse space-x-reverse" : ""}`}>
            <div className={`w-7 h-7 rounded-lg flex items-center justify-center shrink-0 ${
              isUser ? "bg-slate-700 text-slate-200" : "bg-gradient-to-tr from-indigo-600 to-violet-600 text-white shadow"
            }`}>
              {isUser ? <Icons.User /> : <Icons.Bot />}
            </div>

            <div className="flex flex-col">
              <div className={`px-3.5 py-2.5 rounded-2xl text-xs md:text-sm ${
                isUser
                  ? "bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-tr-none shadow"
                  : "glass-card text-slate-200 rounded-tl-none border border-slate-700/60"
              }`}>
                {msg.toolsCalled && msg.toolsCalled.length > 0 && (
                  <div className="mb-2">
                    {msg.toolsCalled.map((toolEvent, i) => (
                      <ToolExecutionCard key={i} toolEvent={toolEvent} />
                    ))}
                  </div>
                )}

                <div className="space-y-1">
                  {renderContent(msg.content)}
                </div>

                {!isUser && msg.content && (msg.content.includes("Booking ID:") || msg.content.includes("Official Carrier PNR:")) && (
                  <TicketConfirmationCard text={msg.content} />
                )}
              </div>

              <span className={`text-[10px] text-slate-500 mt-0.5 px-1 ${isUser ? "text-right" : "text-left"}`}>
                {msg.timestamp || "Just now"}
              </span>
            </div>
          </div>
        </div>
      );
    }

    // Modal: Register Booking / Itinerary Form
    function RegisterBookingModal({ isOpen, onClose, initialData, onBookingSaved, authToken }) {
      if (!isOpen) return null;

      const [category, setCategory] = useState(initialData.category || 'flight');
      const [platform, setPlatform] = useState(initialData.platform || 'Google Flights');
      const [origin, setOrigin] = useState(initialData.origin || '');
      const [destination, setDestination] = useState(initialData.destination || '');
      const [date, setDate] = useState(initialData.date || new Date().toISOString().split('T')[0]);
      const [passengerNames, setPassengerNames] = useState(['']);
      const [ticketClass, setTicketClass] = useState('Economy');
      const [officialPnr, setOfficialPnr] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState('');

      const handleAddPassenger = () => setPassengerNames([...passengerNames, '']);
      const handleNameChange = (idx, val) => {
        const updated = [...passengerNames];
        updated[idx] = val;
        setPassengerNames(updated);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const validNames = passengerNames.filter(n => n.trim() !== '');
        if (validNames.length === 0) {
          setError('Please provide at least 1 passenger name.');
          return;
        }

        setSubmitting(true);
        setError('');

        try {
          const res = await fetch('/api/bookings', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {})
            },
            body: JSON.stringify({
              category,
              origin: origin || 'City A',
              destination: destination || 'City B',
              date: date || '2026-11-20',
              passengers: validNames.length,
              passenger_names: validNames,
              platform: platform || 'Direct Platform',
              official_pnr: officialPnr.trim(),
              ticket_class: ticketClass,
            }),
          });

          const data = await res.json();
          if (res.ok && data.success) {
            onBookingSaved();
            onClose();
          } else {
            setError(data.error || 'Failed to save booking.');
          }
        } catch (err) {
          setError('Network error saving booking.');
        } finally {
          setSubmitting(false);
        }
      };

      return (

              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
                <Icons.Close />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="mt-4 space-y-3.5 text-xs">
              {error && (
                <div className="p-2.5 rounded-lg bg-red-500/15 border border-red-500/30 text-red-300">
                  {error}
                </div>
              )}

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 font-medium block mb-1">Selected Platform</label>
                  <input
                    type="text"

                    className="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="text-slate-400 font-medium block mb-1">Category</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
                  >
                    <option value="flight">Flight</option>
                    <option value="train">Train</option>
                    <option value="bus">Bus</option>
                    <option value="movie">Movie</option>
                    <option value="event">Event</option>
                    <option value="hotel">Hotel</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 font-medium block mb-1">Origin / Venue</label>
                  <input
                    type="text"
                    value={origin}

                    className="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
                  />
                </div>

                />

                </p>

              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="text-slate-400 font-medium">Passenger / Attendee Name(s)</label>

                    onClick={handleAddPassenger}

                    + Add Passenger
                  </button>
                </div>
                <div className="space-y-1.5 max-h-28 overflow-y-auto pr-1">

                    <input
                      key={i}
                      type="text"
                      value={name}
                      onChange={(e) => handleNameChange(i, e.target.value)}
                      placeholder={`Passenger ${i + 1} Full Name`}

              <div className="pt-3 border-t border-slate-800 flex items-center justify-end space-x-2">

    function AuthModal({ isOpen, onClose, onAuthSuccess, initialMode = 'login' }) {
      if (!isOpen) return null;

      const [mode, setMode] = useState(initialMode);

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        setError('');
        setLoading(true);

        try {
          const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
          const payload = mode === 'login' ? { email, password } : { name, email, password };
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (res.ok && data.success) {
            onAuthSuccess(data.token, data.user);
            onClose();
          } else {
            setError(data.error || 'Authentication failed. Please verify credentials.');
          }
        } catch (err) {
          setError('Network error contacting auth service.');
        } finally {
          setLoading(false);
        }

          const data = await res.json();

            onAuthSuccess(data.token, data.user);
            onClose();

    // Main App Component
    function App() {
      // User authentication state
      const [user, setUser] = useState(() => {
        try {
          const stored = localStorage.getItem('mantabooking_user');
          return stored ? JSON.parse(stored) : null;
        } catch (e) {
          return null;
        }
      });
      const [authToken, setAuthToken] = useState(() => {
        return localStorage.getItem('mantabooking_token') || '';
      });
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');

      // Check auth status on mount
      useEffect(() => {
        if (authToken) {
          fetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${authToken}` }
          })
            .then(res => res.json())
            .then(data => {
              if (data.authenticated && data.user) {
                setUser(data.user);
                localStorage.setItem('mantabooking_user', JSON.stringify(data.user));
              } else {
                handleLogout();
              }
            })
            .catch(() => {});
        }
      }, []);

      const handleAuthSuccess = (token, userData) => {
        setAuthToken(token);
        setUser(userData);
        localStorage.setItem('mantabooking_token', token);
        localStorage.setItem('mantabooking_user', JSON.stringify(userData));
        setAuthModalOpen(false);
        fetchBookings(token);
      };

      const handleLogout = async () => {
        if (authToken) {
          try {
            await fetch('/api/auth/logout', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${authToken}` }
            });
          } catch (e) {}
        }
        setAuthToken('');
        setUser(null);
        localStorage.removeItem('mantabooking_token');
        localStorage.removeItem('mantabooking_user');
        setBookings([]);
        setBookingCount(0);
      };

      const handleDemoLogin = async () => {
        try {
          const res = await fetch('/api/auth/demo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            handleAuthSuccess(data.token, data.user);
          }
        } catch (e) {
          console.warn('Demo login error:', e);
        }
      };

      // Navigation state
      const [activeTab, setActiveTab] = useState('flight');
      const [mainView, setMainView] = useState('search'); // 'search' | 'pnr' | 'bookings'
      
      // Search inputs
      const [origin, setOrigin] = useState('JFK');
      const [destination, setDestination] = useState('LHR');
      const [date, setDate] = useState('2026-11-20');
      const [returnDate, setReturnDate] = useState('');
      const [passengers, setPassengers] = useState(1);
      const [travelClass, setTravelClass] = useState('Economy');
      
      // Data state
      const [platforms, setPlatforms] = useState([]);
      const [loadingPlatforms, setLoadingPlatforms] = useState(false);
      const [bookings, setBookings] = useState([]);
      const [bookingCount, setBookingCount] = useState(0);

      // PNR Tracker state
      const [pnrInput, setPnrInput] = useState('');
      const [pnrResult, setPnrResult] = useState(null);
      const [loadingPnr, setLoadingPnr] = useState(false);

      // Registration modal state
      const [registerModalOpen, setRegisterModalOpen] = useState(false);
      const [modalInitialData, setModalInitialData] = useState({});

      // AI Helper Assistant Drawer state
      const [aiDrawerOpen, setAiDrawerOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loadingAi, setLoadingAi] = useState(false);
      const [threadId, setThreadId] = useState(() => Math.random().toString(36).slice(2, 10)); // per-tab conversation id (server also scopes it to the user)
      const [serverStatus, setServerStatus] = useState({ online: true, keyConfigured: true, model: 'groq' });

      const chatEndRef = useRef(null);

      useEffect(() => {
        fetchStatus();
        fetchBookings();
        loadPlatforms(activeTab, origin, destination, date);
      }, []);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loadingAi]);

      const fetchStatus = async () => {
        try {
          const res = await fetch('/api/status');
          if (res.ok) {
            const data = await res.json();
            setServerStatus({
              online: true,
              keyConfigured: data.api_key_configured,
              model: data.model,
              provider: data.provider,
            });
            if (data.bookings_count !== undefined) {
              setBookingCount(data.bookings_count);
            }
          }
        } catch (e) {
          console.warn('Status check error:', e);
        }
      };

      const fetchBookings = async (tokenOverride) => {
        const token = tokenOverride !== undefined ? tokenOverride : authToken;
        if (!token) {
          setBookings([]);
          setBookingCount(0);
          return;
        }
        try {
          const res = await fetch('/api/bookings', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setBookings(data.bookings || []);
            setBookingCount(data.count || 0);
          }
        } catch (e) {
          console.warn('Bookings fetch error:', e);
        }
      };

      const loadPlatforms = async (cat, org, dst, dt) => {
        setLoadingPlatforms(true);
        try {
          const params = new URLSearchParams({
            category: cat || activeTab,
            origin: org || origin,
            destination: dst || destination,
            date: dt || date,
          });
          const res = await fetch(`/api/platforms?${params.toString()}`);
          if (res.ok) {
            const data = await res.json();
            setPlatforms(data.platforms || []);
          }
        } catch (e) {
          console.warn('Error loading platforms:', e);
        } finally {
          setLoadingPlatforms(false);
        }
      };

      // Category change handler
      const handleCategoryChange = (catId) => {
        setActiveTab(catId);
        const presets = POPULAR_PRESETS[catId] || [];
        if (presets.length > 0) {
          setOrigin(presets[0].origin);
          setDestination(presets[0].destination);
          setTravelClass(presets[0].class);
          loadPlatforms(catId, presets[0].origin, presets[0].destination, date);
        } else {
          loadPlatforms(catId, origin, destination, date);
        }
      };

      // Preset click handler
      const handleSelectPreset = (p) => {
        setOrigin(p.origin);
        setDestination(p.destination);
        if (p.class) setTravelClass(p.class);
        loadPlatforms(activeTab, p.origin, p.destination, date);
      };

      // Swap origin/destination
      const handleSwap = () => {
        const temp = origin;
        setOrigin(destination);
        setDestination(temp);
        loadPlatforms(activeTab, destination, temp, date);
      };

      // PNR lookup handler
      const handleCheckPnr = async (e) => {
        if (e) e.preventDefault();
        const clean = pnrInput.trim();
        if (!clean) return;

        setLoadingPnr(true);
        setPnrResult(null);

        try {
          const res = await fetch(`/api/pnr-status?pnr=${encodeURIComponent(clean)}`, {
            headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
          });
          if (res.ok) {
            const data = await res.json();
            setPnrResult(data);
          }
        } catch (err) {
          console.warn('PNR lookup error:', err);
        } finally {
          setLoadingPnr(false);
        }
      };

      // Open registration modal for a specific platform
      const handleOpenRegisterModal = (platformName) => {
        setModalInitialData({
          category: activeTab,
          platform: platformName,
          origin,
          destination,
          date,
        });
        setRegisterModalOpen(true);
      };

      // AI Helper Message Sender
      const handleSendAiMessage = async (textToSend) => {
        const text = (typeof textToSend === 'string' ? textToSend : input).trim();
        if (!text || loadingAi) return;

        setAiDrawerOpen(true);
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const userMsg = { sender: 'user', content: text, timestamp };
        setMessages((prev) => [...prev, userMsg]);
        setInput('');
        setLoadingAi(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {})
            },
            body: JSON.stringify({
              message: text,
              thread_id: threadId,
            }),
          });

          const data = await res.json();
          if (res.ok && data.success) {
            const agentMsg = {
              sender: 'agent',
              content: data.reply,
              toolsCalled: data.tools_called || [],
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            };
            setMessages((prev) => [...prev, agentMsg]);
            if (data.bookings_count !== undefined) {
              setBookingCount(data.bookings_count);
              fetchBookings(authToken);
            }
          } else if (data.requires_auth) {
            setAuthModalOpen(true);
            setMessages((prev) => [
              ...prev,
              {
                sender: 'agent',
                content: `🔒 ${data.error || 'Please sign in to access your AI Co-Pilot.'}`,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              },
            ]);
          } else {
            setMessages((prev) => [
              ...prev,
              {
                sender: 'agent',
                content: `⚠️ Error from assistant: ${data.error || 'Unable to process query.'}`,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              },
            ]);
          }
        } catch (err) {
          setMessages((prev) => [
            ...prev,
            {
              sender: 'agent',
              content: `⚠️ Could not reach Python backend server on /api/chat. Please check server.py.`,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            },
          ]);
        } finally {
          setLoadingAi(false);
        }
      };

      const handleResetThread = async () => {
        try {
          const res = await fetch('/api/reset', { method: 'POST' });
          const data = await res.json();
          const newId = data.new_thread_id || String(Date.now()).slice(-4);
          setThreadId(newId);
          setMessages([
            {
              sender: 'agent',
              content: `Started a fresh assistant session (Thread ID: ${newId}). How can I assist you with your travels or platform choices?`,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            },
          ]);
        } catch (e) {
          setThreadId(String(Date.now()).slice(-4));
          setMessages([]);
        }
      };

      // Quick launch AI with custom contextual prompt
      const handleAskAiAboutRoute = () => {
        const catName = activeTab.toUpperCase();
        handleSendAiMessage(`Please analyze and compare the available booking platforms for ${catName} from ${origin} to ${destination} on ${date}. Which platform offers the best rates, flexibility, and booking reliability?`);
      };

      const handleAskAiAboutPlatform = (platformName) => {
        handleSendAiMessage(`What are the key advantages, luggage/cancellation policies, and steps to book on ${platformName} for route ${origin} to ${destination}?`);
      };

      // If user is not authenticated, display the Informational Landing Page
      if (!user) {
        return (
          <div className="h-full w-full flex flex-col bg-[#060911] text-slate-100 overflow-hidden relative">
            <VisitorLanding
              onOpenAuth={(mode) => {
                setAuthMode(mode || 'login');
                setAuthModalOpen(true);
              }}
              onDemoLogin={handleDemoLogin}
            />
            <AuthModal
              isOpen={authModalOpen}
              onClose={() => setAuthModalOpen(false)}
              onAuthSuccess={handleAuthSuccess}
              initialMode={authMode}
            />
          </div>
        );
      }

      return (
        <div className="h-full w-full flex flex-col bg-[#060911] text-slate-100 overflow-hidden relative">
          {/* Top Navbar */}
          <header className="glass-panel border-b border-slate-800/80 px-4 md:px-8 py-3.5 flex items-center justify-between z-20 shrink-0">
            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setMainView('search')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center glow-indigo shadow-lg">
                  <Icons.Sparkles />
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-display font-extrabold text-lg md:text-xl text-white tracking-tight">
                      Manta<span className="text-indigo-400">Booking</span>
                    </h1>
                    <span className="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-500/15 border border-indigo-500/30 text-indigo-300">
                      Multi-Mode Booking
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    Search platforms, book official tickets & verify real carrier PNRs
                  </p>
                </div>
              </div>

              {/* View Switcher Tabs */}
              <nav className="hidden lg:flex items-center space-x-1 pl-4 border-l border-slate-800 text-xs font-medium">
                <button
                  onClick={() => setMainView('search')}
                  className={`px-3 py-1.5 rounded-lg transition-all flex items-center space-x-1.5 ${
                    mainView === 'search'
                      ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30'
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <Icons.Search />
                  <span>Search & Book</span>
                </button>

                <button
                  onClick={() => setMainView('pnr')}
                  className={`px-3 py-1.5 rounded-lg transition-all flex items-center space-x-1.5 ${
                    mainView === 'pnr'
                      ? 'bg-amber-600/20 text-amber-300 border border-amber-500/30'
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <Icons.Ticket />
                  <span>PNR Live Tracker</span>
                </button>

                <button
                  onClick={() => {
                    fetchBookings();
                    setMainView('bookings');
                  }}
                  className={`px-3 py-1.5 rounded-lg transition-all flex items-center space-x-1.5 ${
                    mainView === 'bookings'
                      ? 'bg-emerald-600/20 text-emerald-300 border border-emerald-500/30'
                      : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <Icons.Check />
                  <span>My Itineraries</span>
                  {bookingCount > 0 && (
                    <span className="ml-1 px-1.5 py-0.2 rounded-full bg-emerald-500 text-slate-950 font-bold text-[10px]">
                      {bookingCount}
                    </span>
                  )}
                </button>

                {/* Read/Write Database Indicator */}
                <div className="hidden xl:flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-cyan-950/40 border border-cyan-800/40 text-[11px] text-cyan-300 font-mono" title="Read/Write Separation: Master SQLite WAL (Writes) + 2 Read Replicas (Reads)">
                  <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                  <span>DB: Master (W) + 2 Replicas (R)</span>
                </div>
              </nav>
            </div>

            {/* Right Action Controls */}
            <div className="flex items-center space-x-2.5">
              <button
                onClick={() => setMainView('pnr')}
                className="hidden sm:flex lg:hidden items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-amber-500/10 text-amber-300 border border-amber-500/20 text-xs font-medium"
              >
                <Icons.Ticket />
                <span>PNR Check</span>
              </button>

              <button
                onClick={() => {
                  fetchBookings();
                  setMainView('bookings');
                }}
                className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-300 border border-emerald-500/20 text-xs font-medium hover:bg-emerald-500/20 transition-all"
              >
                <Icons.Ticket />
                <span className="hidden sm:inline">Saved Bookings</span>
                <span className="px-1.5 py-0.2 rounded-full bg-emerald-500 text-slate-950 font-bold text-[10px]">
                  {bookingCount}
                </span>
              </button>

              {/* AI Co-Pilot Toggle Button */}
              <button
                onClick={() => setAiDrawerOpen(!aiDrawerOpen)}
                className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-xl font-medium text-xs transition-all ${
                  aiDrawerOpen
                    ? 'bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow-lg shadow-indigo-500/30 ring-2 ring-indigo-400'
                    : 'bg-gradient-to-r from-indigo-600/30 to-violet-600/30 hover:from-indigo-600/50 hover:to-violet-600/50 border border-indigo-500/40 text-indigo-200'
                }`}
              >
                <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <Icons.Sparkles />
                <span>AI Co-Pilot</span>
              </button>

              {/* User Profile Pill & Sign Out */}
              {user && (
                <div className="flex items-center space-x-2 pl-2 border-l border-slate-800">
                  <img
                    src={user.avatar || "https://api.dicebear.com/7.x/initials/svg?seed=User"}
                    alt={user.name}
                    className="w-7 h-7 rounded-lg border border-indigo-500/40 shadow-sm shrink-0"
                  />
                  <div className="hidden sm:block text-left text-xs leading-tight">
                    <div className="font-bold text-white truncate max-w-[110px]">{user.name}</div>
                    <div className="text-[10px] text-emerald-400 font-mono">● Signed In</div>
                  </div>
                  <button
                    onClick={handleLogout}
                    title="Sign Out of MantaBooking"
                    className="p-1.5 rounded-lg bg-slate-800/80 hover:bg-red-500/20 text-slate-400 hover:text-red-300 border border-slate-700/60 hover:border-red-500/30 transition-all text-xs"
                  >
                    <Icons.Close />
                  </button>
                </div>
              )}
            </div>
          </header>

          {/* Main Body View */}
          <div className="flex-1 flex overflow-hidden relative">
            <main className="flex-1 overflow-y-auto px-4 md:px-8 py-6 space-y-6">
              
              {/* VIEW 1: SEARCH & BOOKING STUDIO */}
              {mainView === 'search' && (
                <div className="max-w-6xl mx-auto space-y-6 animate-fade-in pb-16">
                  {/* Category Navigation Pills */}
                  <div className="flex items-center space-x-2 overflow-x-auto pb-1 scrollbar-none">
                    {CATEGORIES.map((cat) => {
                      const IconComp = cat.icon;
                      const isSelected = activeTab === cat.id;
                      return (
                        <button
                          key={cat.id}
                          onClick={() => handleCategoryChange(cat.id)}
                          className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl text-xs md:text-sm font-semibold transition-all whitespace-nowrap ${
                            isSelected
                              ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/25 scale-[1.02]'
                              : 'glass-card text-slate-300 hover:text-white hover:border-slate-600'
                          }`}
                        >
                          <IconComp />
                          <span>{cat.label}</span>
                          <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${
                            isSelected ? 'bg-black/30 text-white' : 'bg-slate-800 text-slate-400'
                          }`}>
                            {cat.badge}
                          </span>
                        </button>
                      );
                    })}
                  </div>

                  {/* Search Engine Studio Card */}
                  <div className="glass-panel rounded-3xl p-5 md:p-7 border border-indigo-500/25 glow-indigo relative overflow-hidden">
                    <div className="flex flex-col md:flex-row md:items-center justify-between pb-5 border-b border-slate-800 gap-3">
                      <div>
                        <h2 className="font-display font-extrabold text-xl md:text-2xl text-white">
                          {activeTab === 'flight' && 'Compare Global Airlines & Book Flights'}
                          {activeTab === 'train' && 'Indian Railways (IRCTC) & International Trains'}
                          {activeTab === 'bus' && 'Intercity Bus Booking & Real-Time Tracking'}
                          {activeTab === 'movie' && 'Cinema Showtimes, IMAX 3D & Multiplex Tickets'}
                          {activeTab === 'event' && 'Concert Tours, Festivals, Comedy & Sports Events'}
                          {activeTab === 'hotel' && 'Worldwide Luxury Hotels, Resorts & Vacation Stays'}
                        </h2>
                        <p className="text-xs text-slate-400 mt-0.5">
                          Direct links with real-time schedule & pricing data. AI Co-Pilot stands by to help compare.
                        </p>
                      </div>

                      {/* Quick Route Swap Pill */}
                      <button
                        onClick={handleAskAiAboutRoute}
                        className="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 text-xs font-medium transition-all"
                      >
                        <Icons.Sparkles />
                        <span>Ask AI to Compare Deals</span>
                      </button>
                    </div>

                    {/* Interactive Input Form */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 pt-5">
                      {/* Origin / Departure Location */}
                      <div className="space-y-1">
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                          {activeTab === 'movie' ? 'Cinema / City' : activeTab === 'hotel' ? 'Destination City' : 'Departure / Origin'}
                        </label>
                        <div className="relative flex items-center">
                          <input
                            type="text"
                            value={origin}
                            onChange={(e) => setOrigin(e.target.value)}
                            placeholder={activeTab === 'movie' ? 'e.g. PVR Cinemas' : 'e.g. JFK / New Delhi'}
                            className="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                          />
                          {activeTab !== 'movie' && activeTab !== 'hotel' && (
                            <button
                              onClick={handleSwap}
                              title="Swap route"
                              className="absolute right-2 p-1 text-slate-400 hover:text-white rounded bg-slate-800 hover:bg-slate-700 transition-colors"
                            >
                              <Icons.Swap />
                            </button>
                          )}
                        </div>
                      </div>

                      {/* Destination / Event Title */}
                      <div className="space-y-1">
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                          {activeTab === 'movie' ? 'Movie Title' : activeTab === 'event' ? 'Concert / Artist' : activeTab === 'hotel' ? 'Property / Area' : 'Arrival / Destination'}
                        </label>
                        <input
                          type="text"
                          value={destination}
                          onChange={(e) => setDestination(e.target.value)}
                          placeholder={activeTab === 'movie' ? 'e.g. Dune Part Two' : 'e.g. London / Mumbai'}
                          className="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                        />
                      </div>

                      {/* Travel Date */}
                      <div className="space-y-1">
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                          {activeTab === 'hotel' ? 'Check-in Date' : 'Journey Date'}
                        </label>
                        <input
                          type="date"
                          value={date}
                          onChange={(e) => setDate(e.target.value)}
                          className="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                        />
                      </div>

                      {/* Passengers & Class tier */}
                      <div className="grid grid-cols-2 gap-2">
                        <div className="space-y-1">
                          <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Passengers</label>
                          <select
                            value={passengers}
                            onChange={(e) => setPassengers(Number(e.target.value))}
                            className="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-2.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                          >
                            <option value={1}>1 Pax</option>
                            <option value={2}>2 Pax</option>
                            <option value={3}>3 Pax</option>
                            <option value={4}>4 Pax</option>
                            <option value={5}>5+ Pax</option>
                          </select>
                        </div>
                        <div className="space-y-1">
                          <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Tier / Class</label>
                          <input
                            type="text"
                            value={travelClass}
                            onChange={(e) => setTravelClass(e.target.value)}
                            className="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-2.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                      </div>
                    </div>

                    {/* Popular Quick Presets Chips */}
                    <div className="pt-4 flex flex-wrap items-center gap-2">
                      <span className="text-[11px] text-slate-400 font-medium">Popular:</span>
                      {(POPULAR_PRESETS[activeTab] || []).map((preset, idx) => (
                        <button
                          key={idx}
                          onClick={() => handleSelectPreset(preset)}
                          className="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-[11px] text-slate-300 hover:text-white border border-slate-700/50 transition-colors"
                        >
                          {preset.label}
                        </button>
                      ))}
                    </div>

                    {/* Action Bar */}
                    <div className="pt-5 mt-4 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-3">
                      <div className="text-xs text-slate-400 flex items-center space-x-2">
                        <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span>Zero Booking Fees • Direct Carrier Links • Live Redirect</span>
                      </div>

                      <div className="flex items-center space-x-2.5 w-full sm:w-auto">
                        <button
                          onClick={() => handleOpenRegisterModal('Selected Partner')}
                          className="flex-1 sm:flex-none px-4 py-2.5 rounded-xl glass-card hover:bg-slate-800 text-xs text-indigo-300 font-medium transition-all"
                        >
                          + Register Itinerary
                        </button>
                        <button
                          onClick={() => loadPlatforms(activeTab, origin, destination, date)}
                          className="flex-1 sm:flex-none px-6 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-xs shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2"
                        >
                          <Icons.Search />
                          <span>Search Platforms</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Platforms Results Section */}
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="font-display font-bold text-lg text-white">
                          Authorized Booking Platforms for {activeTab.toUpperCase()}
                        </h3>
                        <p className="text-xs text-slate-400">
                          Select your preferred platform to complete checkout, or ask the AI Co-Pilot for price advice.
                        </p>
                      </div>

                      <div className="text-xs text-indigo-400 font-mono">
                        {platforms.length} platforms available
                      </div>
                    </div>

                    {loadingPlatforms ? (
                      <div className="h-48 flex flex-col items-center justify-center text-slate-400 space-y-3">
                        <div className="w-8 h-8 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></div>
                        <p className="text-xs">Fetching verified platforms and query links...</p>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {platforms.map((p, idx) => (
                          <div
                            key={idx}
                            className="glass-card glass-card-hover rounded-2xl p-5 border border-slate-800 flex flex-col justify-between space-y-4 relative"
                          >
                            <div className="space-y-2">
                              <div className="flex items-start justify-between">
                                <span className="font-display font-bold text-white text-base">
                                  {p.name}
                                </span>
                                <span className="px-2 py-0.5 rounded text-[10px] font-semibold uppercase bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                                  Verified
                                </span>
                              </div>
                              <p className="text-xs text-slate-400 leading-relaxed">
                                {p.description}
                              </p>
                            </div>

                            <div className="pt-3 border-t border-slate-800/80 space-y-2.5">
                              <div className="flex items-center justify-between text-[11px] text-slate-400">
                                <span>Estimated Base Fare:</span>
                                <span className="text-emerald-400 font-semibold font-mono">
                                  {activeTab === 'flight' && '$150.00'}
                                  {activeTab === 'train' && '$45.00'}
                                  {activeTab === 'bus' && '$25.00'}
                                  {activeTab === 'movie' && '$15.00'}
                                  {activeTab === 'event' && '$75.00'}
                                  {activeTab === 'hotel' && '$95.00'}
                                </span>
                              </div>

                              <div className="grid grid-cols-2 gap-2">
                                <a
                                  href={p.url}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="w-full flex items-center justify-center space-x-1.5 px-3 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-xs shadow transition-all group"
                                >
                                  <span>Book on Site</span>
                                  <Icons.ExternalLink />
                                </a>

                                <button
                                  onClick={() => handleOpenRegisterModal(p.name)}
                                  className="w-full px-3 py-2 rounded-xl glass-card hover:bg-slate-800 text-slate-300 hover:text-white text-xs font-medium transition-all"
                                >
                                  Save Draft
                                </button>
                              </div>

                              <button
                                onClick={() => handleAskAiAboutPlatform(p.name)}
                                className="w-full text-center text-[11px] text-indigo-400 hover:text-indigo-300 py-1 transition-colors flex items-center justify-center space-x-1"
                              >
                                <Icons.Sparkles />
                                <span>Ask AI Co-Pilot about {p.name}</span>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* VIEW 2: PNR LIVE STATUS TRACKER */}
              {mainView === 'pnr' && (
                <div className="max-w-3xl mx-auto space-y-6 animate-fade-in py-6">
                  <div className="text-center space-y-2">
                    <div className="w-12 h-12 rounded-2xl bg-amber-500/15 text-amber-400 border border-amber-500/30 flex items-center justify-center mx-auto mb-2">
                      <Icons.Ticket />
                    </div>
                    <h2 className="font-display font-extrabold text-2xl md:text-3xl text-white">
                      Live PNR & Reservation Status Tracker
                    </h2>
                    <p className="text-xs md:text-sm text-slate-400 max-w-lg mx-auto">
                      Verify real Indian Railways (IRCTC) 10-digit PNRs, Airline 6-character GDS Record Locators, or Agent Session References.
                    </p>
                  </div>

                  <form onSubmit={handleCheckPnr} className="glass-panel p-6 rounded-3xl border border-slate-800 space-y-4">
                    <div className="space-y-1.5">
                      <label className="text-xs font-semibold text-slate-300">Enter PNR / Booking Reference</label>
                      <div className="flex items-center space-x-2">
                        <input
                          type="text"
                          value={pnrInput}
                          onChange={(e) => setPnrInput(e.target.value)}
                          placeholder="e.g. 4521369874 (IRCTC Train) or W4KZ9P (Airline Flight)"
                          className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white font-mono placeholder-slate-500 focus:outline-none focus:border-amber-500"
                        />
                        <button
                          type="submit"
                          disabled={loadingPnr || !pnrInput.trim()}
                          className="px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/20 transition-all disabled:opacity-50"
                        >
                          {loadingPnr ? 'Checking...' : 'Check Status'}
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-2 text-[11px] text-slate-400">
                      <div className="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800">
                        <strong className="text-slate-200 block">Indian Railways:</strong>
                        Exact 10 digits (e.g. 4521369874)
                      </div>
                      <div className="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800">
                        <strong className="text-slate-200 block">Airline PNR:</strong>
                        6 alphanumeric chars (e.g. W4KZ9P)
                      </div>
                      <div className="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800">
                        <strong className="text-slate-200 block">Internal Reference:</strong>
                        AGT-FL-XXXX or AGT-TR-XXXX
                      </div>
                    </div>
                  </form>

                  {/* PNR Results Box */}
                  {pnrResult && (
                    <div className="glass-card rounded-2xl p-6 border border-slate-700/80 space-y-4 animate-fade-in">
                      <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                        <div className="flex items-center space-x-2">
                          <span className="font-mono text-sm font-bold text-amber-300 bg-amber-500/20 px-2.5 py-1 rounded-md border border-amber-500/30">
                            {pnrResult.pnr}
                          </span>
                          <span className="text-xs font-semibold text-white">
                            {pnrResult.info?.name}
                          </span>
                        </div>
                        <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded ${
                          pnrResult.info?.is_official_carrier_pnr
                            ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                            : 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/20'
                        }`}>
                          {pnrResult.info?.is_official_carrier_pnr ? 'Official Carrier PNR' : 'Session Reference'}
                        </span>
                      </div>

                      <p className="text-xs text-slate-300 leading-relaxed">
                        {pnrResult.info?.guidance}
                      </p>

                      {pnrResult.info?.portals && pnrResult.info.portals.length > 0 && (
                        <div className="space-y-2 pt-2">
                          <h4 className="text-xs font-semibold uppercase text-slate-400">
                            Live Official Verification Servers:
                          </h4>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            {pnrResult.info.portals.map((portal, idx) => (
                              <a
                                key={idx}
                                href={portal.url}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="p-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/70 hover:border-amber-500/40 transition-all flex flex-col justify-between group"
                              >
                                <div className="flex items-center justify-between text-xs font-bold text-amber-300 group-hover:text-amber-200">
                                  <span>{portal.name}</span>
                                  <Icons.ExternalLink />
                                </div>
                                <span className="text-[11px] text-slate-400 mt-1">{portal.desc}</span>
                              </a>
                            ))}
                          </div>
                        </div>
                      )}

                      {pnrResult.has_local_booking && pnrResult.booking && (
                        <div className="mt-4 pt-4 border-t border-slate-800 bg-slate-950/50 p-3.5 rounded-xl space-y-2">
                          <span className="text-[11px] font-bold uppercase text-emerald-400">Linked Local Itinerary Record</span>
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs text-slate-300">
                            <div>Route: <span className="text-white font-semibold">{pnrResult.booking.origin} ➔ {pnrResult.booking.destination}</span></div>
                            <div>Date: <span className="text-white">{pnrResult.booking.date}</span></div>
                            <div>Class: <span className="text-indigo-300">{pnrResult.booking.ticket_class}</span></div>
                            <div>Status: <span className="text-emerald-400 font-bold">{pnrResult.booking.status}</span></div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* VIEW 3: MY BOOKINGS / SAVED ITINERARIES */}
              {mainView === 'bookings' && (
                <div className="max-w-5xl mx-auto space-y-6 animate-fade-in py-4">
                  <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                    <div>
                      <h2 className="font-display font-extrabold text-2xl text-white">
                        My Booked Reservations & Itineraries
                      </h2>
                      <p className="text-xs text-slate-400 flex items-center space-x-2 mt-1">
                        <span>{bookings.length} reservations</span>
                        <span className="text-slate-600">•</span>
                        <span className="text-cyan-400 font-mono text-[11px] bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800/40">
                          ⚡ CQRS: Master SQLite (Writes) + 2 Read Replicas (Reads)
                        </span>
                      </p>
                    </div>

                    <button
                      onClick={() => handleOpenRegisterModal('Custom Booking')}
                      className="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-xs shadow transition-all"
                    >
                      + Add Reservation
                    </button>
                  </div>

                  {bookings.length === 0 ? (
                    <div className="h-64 flex flex-col items-center justify-center text-center p-6 text-slate-500 glass-panel rounded-3xl">
                      <div className="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mb-3">
                        <Icons.Ticket />
                      </div>
                      <p className="text-sm font-semibold text-slate-300">No Reservations Stored Yet</p>
                      <p className="text-xs text-slate-500 mt-1 max-w-sm">
                        Use the search engine to browse platforms, save a draft itinerary, or enter your official PNR.
                      </p>
                      <button
                        onClick={() => setMainView('search')}
                        className="mt-4 px-4 py-2 rounded-xl bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-xs text-indigo-300 font-medium"
                      >
                        Explore Platforms ➔
                      </button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {bookings.map((b, idx) => (
                        <div key={idx} className="glass-card rounded-2xl p-5 border border-slate-800 space-y-3.5 relative overflow-hidden">
                          <div className="flex items-center justify-between">
                            <span className="px-2.5 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                              {b.category}
                            </span>
                            <span className="font-mono text-xs font-bold text-emerald-400">
                              {b.official_pnr ? `${b.official_pnr} (Official PNR)` : b.booking_id}
                            </span>
                          </div>

                          <div className="text-base font-bold text-white">
                            {b.origin} ➔ {b.destination}
                          </div>

                          <div className="grid grid-cols-2 gap-2 text-xs text-slate-400 bg-slate-950/40 p-3 rounded-xl">
                            <div>Platform: <span className="text-indigo-300 font-semibold">{b.platform || 'Direct'}</span></div>
                            <div>Date: <span className="text-slate-200">{b.date}</span></div>
                            <div>Class: <span className="text-slate-200">{b.ticket_class}</span></div>
                            <div>Cost: <span className="text-emerald-400 font-bold">{b.total_cost_usd}</span></div>
                            {b.passenger_names && (
                              <div className="col-span-2 truncate text-[11px] text-slate-400 pt-1 border-t border-slate-800">
                                Passengers: <span className="text-slate-200">{b.passenger_names.join(', ')}</span>
                              </div>
                            )}
                          </div>

                          <div className="pt-2 flex items-center justify-between text-xs">
                            <button
                              onClick={() => {
                                setPnrInput(b.official_pnr || b.booking_id);
                                setMainView('pnr');
                              }}
                              className="text-amber-400 hover:text-amber-300 font-medium"
                            >
                              Check Live PNR ➔
                            </button>

                            <button
                              onClick={() => handleSendAiMessage(`Please check the status of reservation ${b.official_pnr || b.booking_id} and email the itinerary to my email.`)}
                              className="text-indigo-400 hover:text-indigo-300"
                            >
                              Email / Ask AI ➔
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* AI HELPER CO-PILOT SLIDE-OVER DRAWER */}
            {aiDrawerOpen && (
              <aside className="w-full md:w-[440px] lg:w-[480px] glass-panel border-l border-slate-800 h-full flex flex-col z-30 shadow-2xl absolute md:relative right-0 top-0 bottom-0 bg-[#0B0F19]/95 backdrop-blur-2xl animate-fade-in">
                {/* AI Header */}
                <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
                  <div className="flex items-center space-x-2.5">
                    <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center glow-indigo shadow">
                      <Icons.Sparkles />
                    </div>
                    <div>
                      <div className="flex items-center space-x-1.5">
                        <h3 className="font-display font-bold text-white text-sm">AI Travel Co-Pilot</h3>
                        <span className="text-[9px] font-mono px-1.5 py-0.2 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                          LangGraph
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-400">
                        Ask travel questions, compare deals, or verify PNRs
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-1">
                    <button
                      onClick={handleResetThread}
                      title="New Conversation"
                      className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                    >
                      <Icons.Refresh />
                    </button>
                    <button
                      onClick={() => setAiDrawerOpen(false)}
                      title="Close Co-Pilot"
                      className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                    >
                      <Icons.Close />
                    </button>
                  </div>
                </div>

                {/* AI Chat History */}
                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {messages.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-center p-6 space-y-4 my-auto">
                      <div className="w-12 h-12 rounded-2xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
                        <Icons.Bot />
                      </div>
                      <div>
                        <h4 className="font-display font-bold text-white text-sm">Your Personal Booking Helper</h4>
                        <p className="text-xs text-slate-400 mt-1 max-w-xs mx-auto">
                          I can research ticket prices on live platforms, compare luggage rules, find cheapest dates, or verify PNR status.
                        </p>
                      </div>

                      <div className="w-full space-y-1.5 text-left pt-2">
                        <button
                          onClick={() => handleSendAiMessage(`Which platform is best for booking flights from ${origin} to ${destination}?`)}
                          className="w-full text-left p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs text-slate-300 border border-slate-800 transition-colors"
                        >
                          ✈️ Best flight platforms for {origin} ➔ {destination}?
                        </button>
                        <button
                          onClick={() => handleSendAiMessage(`Check PNR 4521369874 status and official live links`)}
                          className="w-full text-left p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs text-slate-300 border border-slate-800 transition-colors"
                        >
                          🚆 How to verify Indian Railways PNR 4521369874?
                        </button>
                        <button
                          onClick={() => handleSendAiMessage(`Browse top travel guidelines and seasonal weather for ${destination}`)}
                          className="w-full text-left p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs text-slate-300 border border-slate-800 transition-colors"
                        >
                          🌐 Travel tips and weather in {destination}?
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div>
                      {messages.map((m, idx) => (
                        <MessageBubble key={idx} msg={m} />
                      ))}

                      {loadingAi && (
                        <div className="flex items-start space-x-2.5 my-3">
                          <div className="w-7 h-7 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center shrink-0">
                            <Icons.Bot />
                          </div>
                          <div className="glass-card px-3.5 py-2.5 rounded-2xl rounded-tl-none border border-slate-700/60 flex items-center space-x-2 text-xs text-slate-300">
                            <div className="flex space-x-1">
                              <div className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce"></div>
                              <div className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce" style={{ animationDelay: '0.2s' }}></div>
                              <div className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce" style={{ animationDelay: '0.4s' }}></div>
                            </div>
                            <span>Reasoning with LangGraph skills...</span>
                          </div>
                        </div>
                      )}
                      <div ref={chatEndRef} />
                    </div>
                  )}
                </div>

                {/* AI Input Box */}
                <div className="p-3 border-t border-slate-800 bg-slate-950/80">
                  <div className="flex items-center space-x-2">
                    <input
                      type="text"
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                          e.preventDefault();
                          handleSendAiMessage();
                        }
                      }}
                      placeholder="Ask AI helper to compare, verify PNR, or research..."
                      className="flex-1 bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                    />
                    <button
                      onClick={() => handleSendAiMessage()}
                      disabled={loadingAi || !input.trim()}
                      className="h-9 px-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium text-xs shadow transition-all disabled:opacity-50"
                    >
                      <Icons.Send />
                    </button>
                  </div>
                  <div className="flex items-center justify-between text-[10px] text-slate-500 mt-1.5 px-1">
                    <span>Press Enter to send</span>
                    <span className="font-mono text-indigo-400">thread={threadId}</span>
                  </div>
                </div>
              </aside>
            )}
          </div>

          {/* Floating AI Helper Button (When drawer is closed) */}
          {!aiDrawerOpen && (
            <button
              onClick={() => setAiDrawerOpen(true)}
              className="fixed bottom-6 right-6 z-40 flex items-center space-x-2 px-4 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 text-white font-semibold text-xs shadow-2xl shadow-indigo-600/50 hover:scale-105 active:scale-95 transition-all glow-indigo"
            >
              <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
              <Icons.Sparkles />
              <span>AI Co-Pilot Helper</span>
            </button>
          )}

          {/* Modal */}
          <RegisterBookingModal
            isOpen={registerModalOpen}
            onClose={() => setRegisterModalOpen(false)}
            initialData={modalInitialData}
            authToken={authToken}
            onBookingSaved={() => {
              fetchBookings(authToken);
              setMainView('bookings');
            }}
          />
          <AuthModal
            isOpen={authModalOpen}
            onClose={() => setAuthModalOpen(false)}
            onAuthSuccess={handleAuthSuccess}
            initialMode={authMode}
          />
        </div>
      );
    }

    // Render React app to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <!-- Service Worker Registration for PWA / Android Trusted Web Activity -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('[PWA] Service Worker registered with scope:', reg.scope))
          .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
